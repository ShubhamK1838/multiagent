spring:
  application:
    name: ai-framework

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aiframework}
    username: ${DB_USER:postgres}
    password: ${DB_PASS:system}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholder-replacement: false

  ai:
    # Chat models are built dynamically from the ai_models table (see ChatClientProvider).
    # Disable every OpenAI auto-config (chat, audio, image, moderation) so the starter
    # doesn't try to construct beans that need a global api-key. Only Ollama embedding
    # auto-config stays on so RAG keeps working out of the box.
    model:
      chat: none
      embedding: ollama
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: ${EMBEDDING_MODEL:nomic-embed-text}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.aiframework: DEBUG
    org.springframework.ai: INFO

    org:
      springframework:
        web:
          reactive:
            function:
              client:
                ExchangeFunctions=TRACE: